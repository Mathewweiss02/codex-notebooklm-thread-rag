name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Synchronize locked dependencies
        run: uv sync --locked --group audit
      - name: Run offline test suite
        shell: pwsh
        run: ./tests/run_all.ps1 -PythonPath ./.venv/Scripts/python.exe -NodePath node -ReportPath .ci/full-gate-run.json
      - name: Verify full-gate report revision
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          $report = Get-Content -Raw -LiteralPath .ci/full-gate-run.json | ConvertFrom-Json
          if ([string]$report.Status -ne "passed") { throw "full-gate report did not pass" }
          if ([string]$report.CommitSha -ne $env:EXPECTED_COMMIT) {
            throw "full-gate report commit does not match the checked-out revision"
          }
          Write-Output ("full-gate revision verified: " + $report.CommitSha)
      - name: Export locked runtime graph
        run: uv --quiet export --locked --no-default-groups --no-emit-project --format requirements.txt --output-file audit-requirements.txt
      - name: Audit Python dependencies
        run: uv run --group audit pip-audit --strict --require-hashes --disable-pip -r audit-requirements.txt
